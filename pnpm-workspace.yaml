packages:
  - "."

allowBuilds:
  better-sqlite3: true
  bufferutil: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Allow specific packages to run install scripts.
# better-sqlite3 needs a native rebuild on install (postinstall handles it).
# The `ignoredBuiltDependencies` field is the pnpm v9 syntax which still
# suppresses the lockfile warning, but newer pnpm versions prefer
# `onlyBuiltDependencies` (the inverse) to keep the lockfile deterministic.
onlyBuiltDependencies:
  - better-sqlite3

overrides:
  axios: ">=1.18.0"
  ws: ">=8.21.0"
  postcss: ">=8.5.18"
  js-yaml: ">=4.3.0"
  protobufjs: ">=7.6.5"
  langsmith: ">=0.6.0"
  nanoid: ">=3.3.8"
  prismjs: ">=1.30.0"
  mdast-util-to-hast: ">=13.2.1"
  '@opentelemetry/core': ">=2.8.0"
  uuid: ">=11.1.1"
  jsondiffpatch: ">=0.7.2"
  '@ai-sdk/provider-utils': ">=3.0.98"
  '@babel/core': ">=7.29.1"
  form-data: ">=4.0.6"
  '@grpc/grpc-js': ">=1.14.4"
  esbuild: ">=0.28.1"
  playwright: ">=1.55.1"
  sharp: ">=0.35.0"
